<div class="activity-container">
  
  <!-- Linear Progress Bar -->
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="((currentIndex + 1) / cards.length) * 100"></div>
  </div>

  <!-- Cards Track Viewport -->
  <div class="slider-viewport" *ngIf="currentCard">
    <div class="slider-track">
      <div class="slider-slide">
        <div class="active-frame">
          <div class="card-header">
            <h2>{{ currentCard.title }}</h2>
          </div>
          <div class="card-content">
            @switch (currentCard.type) {
              @case ('content') {
                <div class="content" [innerHTML]="currentCard.content"></div>
              }
              @case ('mcq') {
                <app-mcq-view 
                  [data]="$any(currentCard.content)" 
                  (validated)="onAnswerEvaluated($event)">
                </app-mcq-view>
              }
              @case ('blank') {
                <app-blank-view
                  [data]="$any(currentCard.content)"
                  (validated)="onAnswerEvaluated($event)">
                </app-blank-view>
              }
              @case ('match') {
                <app-match-view
                  [data]="$any(currentCard.content)"
                  (validated)="onAnswerEvaluated($event)">
                </app-match-view>
              }
              @case ('order') {
                <app-order-view
                  [data]="$any(currentCard.content)"
                  (validated)="onAnswerEvaluated($event)">
                </app-order-view>
              }
              @case ('code') {
                <app-code-view
                  [data]="$any(currentCard.content)"
                  (validated)="onAnswerEvaluated($event)">
                </app-code-view>
              }
            }
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Persistent User Navigation Context Footer -->
  <div class="slider-actions">
    <button class="action-btn secondary" (click)="prev()" [disabled]="isFirst()">
      Back
    </button>
    
    <button class="action-btn primary" (click)="next()" [disabled]="!(currentCard && currentCard.completed)">
      {{ isLast() ? 'Finish Activity' : 'Next' }}
    </button>
  </div>

</div>
