<div class="main-content" *ngIf="roadmap">

  <!-- Breadcrumb  -->
  <nav class="breadcrumb text-subtitle">
    <a routerLink="">🏠Home</a>
    <span>/</span>
    <a routerLink="/roadmaps">🎯Roadmaps</a>
    <span>/</span>
  </nav>

  <!-- Roadmap Title -->
  <article>
    <div class="m-20">
        <div class="d-ib">
            <h1><span class="text-gradient">{{ roadmap.title }}</span> </h1>
        </div>        
    </div>     
  </article>

  <!-- ROADMAP -->
  <section class="roadmap-container">

    <div class="roadmap-canvas" [class.tall-roadmap]="courses.length > 5" #roadmapCanvas>

      <!-- SVG JOURNEY PATH -->
      <svg class="journey-svg" [attr.viewBox]="'0 0 ' + canvasWidth + ' ' + canvasHeight" preserveAspectRatio="none">

        <!-- Path shadow -->
        <path class="journey-path-shadow" [attr.d]="roadmapPath">
        </path>

        <!-- Main path -->
        <path class="journey-path" [attr.d]="roadmapPath">
        </path>

        <!-- Completed progress overlay -->
        <path class="journey-path-completed" [attr.d]="completedPath">
        </path>

      </svg>


      <!-- START -->
      <div class="journey-point start-point" [style.left.%]="startPosition.x" [style.top.%]="startPosition.y">

        <div class="start-line"></div>

        <div class="start-node">
          <span>🚩</span>
        </div>

        <div class="start-label">
          <strong>
            {{roadmap.startLabel}}
          </strong>
        </div>

      </div>


      <!-- COURSE NODES -->
      <div *ngFor="let course of courses; let i = index; trackBy: trackCourse" class="course-wrapper"
        [style.left.%]="course._position.x" [style.top.%]="course._position.y" [class.available]="true">


        <!-- NODE -->
        <button class="course-node" type="button" [attr.aria-label]="course.name" [routerLink]="['/courses', course.id]">

          <!-- Level -->
          <span class="level-number">
            {{ i + 1 }}
          </span>

          <!-- Glow -->
          <span class="node-glow"></span>

          <!-- Icon -->
          <span class="node-icon">

            <cicon *ngIf="course.icon" [tech]="course.icon" height="55px"></cicon>

            <span *ngIf="!course.icon" class="text-icon">

              {{ getDefaultIcon(course.category) }}

            </span>

          </span>


        </button>


        <!-- COURSE CARD -->
        <article class="course-card" [class.card-left]="course._cardPosition === 'left'"
          [class.card-right]="course._cardPosition === 'right'" [class.card-top]="course._cardPosition === 'top'"
          [class.card-bottom]="course._cardPosition === 'bottom'">

          <!-- Connector -->
          <span class="card-connector"></span>
        
          <div class="text-lead nav-link" style="width:max-content;text-decoration:underline;" [routerLink]="['/courses', course.id]">
            {{ course.name }}
          </div>
        
        </article>

      </div>


      <!-- FINISH -->
      <div class="journey-point finish-point" [style.left.%]="finishPosition.x" [style.top.%]="finishPosition.y">

        <div class="finish-node">
          🏆
        </div>

        <div class="finish-label">
          <strong>
            {{roadmap.finishLabel}}
          </strong>
        </div>

      </div>

    </div>

  </section>

</div>
