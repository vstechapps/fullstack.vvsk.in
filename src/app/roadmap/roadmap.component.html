<div class="main-content" *ngIf="!loading && roadmap; else loadingTpl">
  <nav class="breadcrumb text-subtitle">
    <a href="/">Home</a>
    <span>/</span>
    <a href="/roadmaps">Roadmaps</a>
    <span>/</span>
    <span>{{ roadmap.title }}</span>
  </nav>

  <section class="card" style="padding: 24px; margin-top: 24px;">
    <div class="d-flex" style="gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;">
      <cicon [tech]="roadmap.icon" height="50px"></cicon>
      <span class="text-title text-gradient" style="margin-left:15px;vertical-align:middle;margin-right:15px">{{ roadmap.title }}</span>
      <span class="badge badge-default" *ngFor="let label of roadmap.labels || []">{{ label }}</span>
    </div>

    <p>{{ roadmap.description }}</p>

    <div class="card" style="margin: 15px;display:inline-block;padding:10px 15px" *ngFor="let topic of roadmap.topicsList || [], index as i" >
        <span class="text-index">{{i+1}}</span>
        <span class="text-subtitle">{{topic}}</span>
    </div>
  </section>
</div>

<ng-template #loadingTpl>
  <div class="main-content">
    <p class="text-subtitle">Loading roadmap...</p>
  </div>
</ng-template>
